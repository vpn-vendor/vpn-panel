# Экземпляр защищённого канала панели.
#
# Перезапуск с растущей паузой и ограничением частоты: канал, который не
# поднимается, не должен обращаться к серверу подключения снова и снова.
# После исчерпания попыток службой распоряжается панель.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=1

[Service]
Restart=always
RestartSec=5
RestartSteps=5
RestartMaxDelaySec=300
RuntimeDirectory=vpn-panel-ovpn
RuntimeDirectoryMode=0755
