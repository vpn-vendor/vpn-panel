# Первая настройка Ubuntu после установки шлюза: человеку остаются только
# вопросы, на которые нет хорошего ответа по умолчанию, — имя пользователя и
# компьютера, пароль, часовой пояс — и экран «Всё готово», который открывает
# рабочий стол. Язык и раскладки задала установка, сеть настраивает панель,
# платные услуги, сбор сведений и местоположение шлюзу не нужны.
# Файл читается вместо /usr/share/gnome-initial-setup/vendor.conf.
[pages]
skip=welcome;language;keyboard;network;privacy;software;eula;ubuntu_pro;ubuntu_insights;appearance;apps;parental_controls;parent_password
