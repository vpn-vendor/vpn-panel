# Экран пароля диска работает на встроенной в ядро английской раскладке:
# раскладка системы, выбранная после задания пароля, в initramfs не попадает,
# иначе те же клавиши дали бы другие символы и пароль перестал бы подходить.
omit_dracutmodules+=" console-setup i18n "
add_dracutmodules+=" vpn-panel-keymap "
