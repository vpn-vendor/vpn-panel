# Экземпляр подключения к провайдеру по логину и паролю.
#
# ПРЕДЕЛА ЧАСТОТЫ СТАРТОВ ЗДЕСЬ НЕТ НАМЕРЕННО (StartLimitIntervalSec=0).
# У защищённого канала он есть и там уместен: канал, который не сходится,
# не должен долбить сервер подключения. Здесь всё наоборот — это аплинк
# офиса. «Сдался» на аплинке означает офис без сети до приезда человека, а
# провайдер может молчать часами по своим причинам: работы на линии,
# перезагрузка концентратора, авария у оператора. Роутер в такой ситуации
# продолжает набирать — и мы продолжаем.
[Unit]
StartLimitIntervalSec=0

[Service]
# Растущая пауза — единственный тормоз, и он же защищает учётную запись.
# У оператора есть счётчик неудачных проверок: частые попытки с неверным
# паролем ведут к временной блокировке, то есть опечатка администратора
# превратилась бы в отключение офиса на сутки. Пауза растёт от 10 секунд до
# десяти минут: первые попытки быстрые (обычный случай — линия моргнула),
# дальше редкие (необычный — данные не подходят).
Restart=on-failure
RestartSec=10
RestartSteps=6
RestartMaxDelaySec=600

# Перед pppd — дождаться канального интерфейса (подынтерфейс VLAN появляется
# позже, чем systemd стартует этот экземпляр). Срыв ожидания — ошибка
# процесса, её подхватывает Restart= выше.
ExecStartPre=/usr/libexec/vpn-panel/ppp-wait-link

