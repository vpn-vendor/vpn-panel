# Меню носителя установки шлюза. Загрузчик и его образы — от Ubuntu, меняется
# только этот текст. Язык живой системы и окна подтверждения — из профиля.
# Пункты называют следствие, а не механизм: первые два ставят шлюз и стирают
# диск, второй — без драйвера видеокарты, для экранов, которые остаются
# чёрными; «рядом с другой системой» ставит шлюз в свободное место диска
# (параметр ядра vp.beside=1 читает ранний шаг установки); «переустановить»
# стирает только прежний шлюз, поставленный рядом с другой системой, и ставит
# его в те же разделы (vp.reinstall=1). Заголовки по-русски, если графический
# терминал и шрифт доступны, иначе латиницей: меню работает в любом случае.
#
# Если шлюз уже установлен, а флешка осталась в компьютере, прошивка может
# снова загрузить её. Установка оставляет метку в /boot (вне шифрования, есть
# и на UEFI, и на BIOS); найдя метку и рядом с ней меню шлюза, это меню
# ставит первым и по умолчанию установленный шлюз с коротким отсчётом и
# грузит его через его же меню (configfile). Цепочка на shim или grubx64.efi
# не годится: загруженный по цепочке GRUB считает своим устройством носитель
# и не находит свои файлы. Без метки или без меню шлюза (чистый диск, шлюз
# снесён) — меню прежнее: установка первым пунктом.
#
# noprompt: после установки или её остановки живая система при перезагрузке
# не ждёт Enter под английским «Please remove the installation medium» (так
# casper спрашивает только у съёмного носителя, поэтому VM этого не видят).
# Забытую флешку закрывает само меню: с меткой оно грузит установленный шлюз.
#
# Режим загрузки флешки меню знает само (grub_platform). Без UEFI пунктов
# «рядом» и «переустановить» нет — они работают только через UEFI; вместо
# них пункт с объяснением, как загрузить флешку через UEFI. Если на диске
# найдена Windows, загруженная через UEFI, этот пункт первый и по умолчанию:
# отсчёт не должен доходить до стирания диска с ней. Пункт показывает текст
# и возвращает в это же меню (@SELF@ — путь этого файла на носителе).
#
# Пункт переустановки виден всегда: шлюз, поставленный до появления метки,
# меню не распознаёт, а разделы прежнего шлюза ранний шаг ищет сам и без
# них останавливается с объяснением. С меткой пункт «рядом с другой системой»
# не показывается: свободного места на диске с нашим шлюзом уже нет.
set timeout=30
set timeout_style=menu
set vp_installed=0
# BIOS-образ GRUB на носителе без этих модулей не видит разделы GPT и ext4;
# в образе UEFI они встроены, и insmod там ничего не делает.
insmod part_gpt
insmod part_msdos
insmod ext2
grub_platform
set vp_efi=0
set vp_win=0
if [ "$grub_platform" = "efi" ]; then
    set vp_efi=1
else
    insmod fat
    if search --no-floppy --file /EFI/Microsoft/Boot/bootmgfw.efi --set=vp_win_dev; then
        set vp_win=1
    fi
fi
if search --no-floppy --file /vpn-panel.installed --set=vp_boot; then
    if [ -f ($vp_boot)/grub/grub.cfg ]; then
        set vp_installed=1
        set timeout=5
    fi
fi

insmod all_video
set vp_ru=0
if loadfont unicode; then
    set gfxmode=auto
    insmod gfxterm
    if terminal_output gfxterm; then
        set vp_ru=1
    fi
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

if [ "$vp_installed" = 1 ]; then
if [ "$vp_ru" = 1 ]; then
menuentry "Шлюз уже установлен — загрузить его. Флешку можно вынуть" {
    configfile ($vp_boot)/grub/grub.cfg
}
else
menuentry "Gateway already installed - boot it. You can remove the USB stick" {
    configfile ($vp_boot)/grub/grub.cfg
}
fi
fi
if [ "$vp_ru" = 1 ]; then
if [ "$vp_efi" = 0 -a "$vp_win" = 1 ]; then
menuentry "Флешка загружена без UEFI — что делать" {
    echo "Флешка загружена в старом режиме, без UEFI."
    echo "Установка рядом с другой системой и переустановка шлюза работают"
    echo "только через UEFI, поэтому этих пунктов в меню нет."
    if [ "$vp_win" = 1 ]; then
        echo ""
        echo "На диске есть Windows, установленная через UEFI. Установка на весь"
        echo "диск сотрёт её."
    fi
    echo ""
    echo "Что сделать: перезагрузите компьютер, откройте меню выбора загрузки"
    echo "(обычно F12, F11 или Esc) и выберите флешку со словом UEFI в названии."
    echo ""
    echo "Нажмите Esc, чтобы вернуться в меню."
    sleep --interruptible 600
    configfile @SELF@
}
fi
menuentry "Установить шлюз VPN Panel — стирает весь диск" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
menuentry "Установить шлюз, если экран чёрный или мигает" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt nomodeset @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
if [ "$vp_efi" = 1 ]; then
if [ "$vp_installed" = 0 ]; then
menuentry "Установить шлюз рядом с другой системой — в свободное место, для опытных" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt vp.beside=1 @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
fi
menuentry "Переустановить шлюз — прежний стирается, другая система не тронется" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt vp.reinstall=1 @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
elif [ "$vp_win" = 0 ]; then
menuentry "Флешка загружена без UEFI — что делать" {
    echo "Флешка загружена в старом режиме, без UEFI."
    echo "Установка рядом с другой системой и переустановка шлюза работают"
    echo "только через UEFI, поэтому этих пунктов в меню нет."
    if [ "$vp_win" = 1 ]; then
        echo ""
        echo "На диске есть Windows, установленная через UEFI. Установка на весь"
        echo "диск сотрёт её."
    fi
    echo ""
    echo "Что сделать: перезагрузите компьютер, откройте меню выбора загрузки"
    echo "(обычно F12, F11 или Esc) и выберите флешку со словом UEFI в названии."
    echo ""
    echo "Нажмите Esc, чтобы вернуться в меню."
    sleep --interruptible 600
    configfile @SELF@
}
fi
else
if [ "$vp_efi" = 0 -a "$vp_win" = 1 ]; then
menuentry "USB stick started without UEFI - what to do" {
    echo "The USB stick started in legacy mode, without UEFI."
    echo "Installing beside another system and reinstalling the gateway"
    echo "work only with UEFI, so these entries are hidden."
    if [ "$vp_win" = 1 ]; then
        echo ""
        echo "This disk has Windows installed with UEFI. Installing on the"
        echo "whole disk will erase it."
    fi
    echo ""
    echo "Restart the computer, open the boot menu (usually F12, F11 or Esc)"
    echo "and choose the USB stick with UEFI in its name."
    echo ""
    echo "Press Esc to return to the menu."
    sleep --interruptible 600
    configfile @SELF@
}
fi
menuentry "Install VPN Panel gateway - erases the whole disk" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
menuentry "Install gateway if the screen is black or flickers" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt nomodeset @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
if [ "$vp_efi" = 1 ]; then
if [ "$vp_installed" = 0 ]; then
menuentry "Install gateway beside another system - into free space, advanced" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt vp.beside=1 @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
fi
menuentry "Reinstall gateway - old gateway is erased, the other system is kept" {
    set gfxpayload=keep
    linux  /casper/vmlinuz noprompt vp.reinstall=1 @AUTOINSTALL@ @ISO_SCAN@ locale=@LOCALE@ --- quiet splash
    initrd /casper/initrd
}
elif [ "$vp_win" = 0 ]; then
menuentry "USB stick started without UEFI - what to do" {
    echo "The USB stick started in legacy mode, without UEFI."
    echo "Installing beside another system and reinstalling the gateway"
    echo "work only with UEFI, so these entries are hidden."
    if [ "$vp_win" = 1 ]; then
        echo ""
        echo "This disk has Windows installed with UEFI. Installing on the"
        echo "whole disk will erase it."
    fi
    echo ""
    echo "Restart the computer, open the boot menu (usually F12, F11 or Esc)"
    echo "and choose the USB stick with UEFI in its name."
    echo ""
    echo "Press Esc to return to the menu."
    sleep --interruptible 600
    configfile @SELF@
}
fi
fi
grub_platform
if [ "$grub_platform" = "efi" ]; then
if [ "$vp_ru" = 1 ]; then
menuentry "Не устанавливать: загрузиться со следующего диска" {
    exit 1
}
menuentry "Настройки прошивки компьютера (UEFI)" {
    fwsetup
}
else
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
fi
fi
